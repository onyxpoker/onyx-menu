<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONYX Poker Club — меню</title>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0e7d4;--ink:#1b1916;--acc:#8c1c2b;--mut:#6a5f50;--rule:rgba(140,28,43,.55);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:repeating-linear-gradient(0deg,rgba(70,45,20,.045) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(130,95,50,.22) 100%),#f0e7d4;color:var(--ink);font:16px/1.4 'Jost',sans-serif}
.w{position:relative;max-width:720px;margin:0 auto;padding:44px 28px 64px}
.w::before{content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:3px double rgba(140,28,43,.55);pointer-events:none}
.logo{text-align:center}
.logo b{display:block;font:400 clamp(44px,13vw,64px)/1.1 'Old Standard TT',serif;letter-spacing:.3em;margin-right:-.3em}
.logo i{display:block;font-style:normal;font-size:11px;letter-spacing:.8em;margin-right:-.8em;color:var(--acc)}
.tabs{display:flex;justify-content:center;gap:12px;margin:28px 0 14px}
button{font:inherit;color:var(--ink);background:none;border:1px solid var(--rule);min-height:44px;cursor:pointer}
.tabs button{padding:0 30px;font:500 15px 'Jost',sans-serif;letter-spacing:.25em;text-transform:uppercase}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#f0e7d4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.chips button{flex:none;padding:0 16px;border-radius:22px;font-size:14px}
h2{margin:22px 0 8px;padding-bottom:8px;border-bottom:2px solid var(--ink);font:700 24px/1.15 'Old Standard TT',serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid rgba(27,25,22,.16)}
.n{font-size:17px}
.d{grid-column:1;font-size:13.5px;color:var(--mut)}
.rt{grid-column:2;grid-row:1/3;text-align:right;white-space:nowrap}
.p{font-weight:500;font-size:17px}
.q{font-size:13px;color:var(--mut)}
</style>
</head>

function render(){
