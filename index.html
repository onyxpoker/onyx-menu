<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONYX Poker Club — меню</title>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0e7d4;--ink:#1b1916;--acc:#8c1c2b;--mut:#6a5f50;--rule:rgba(140,28,43,.55);--field:#fbf6ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:repeating-linear-gradient(0deg,rgba(70,45,20,.045) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(130,95,50,.22) 100%),#f0e7d4;color:var(--ink);font:16px/1.4 'Jost',sans-serif}
body.lock{overflow:hidden}
.w{position:relative;max-width:720px;margin:0 auto;padding:44px 28px 120px}
.w::before{content:'';position:absolute;top:10px;left:10px;right:10px;bottom:10px;border:3px double rgba(140,28,43,.55);pointer-events:none}
.logo{text-align:center}
.logo b{display:block;font:400 clamp(44px,13vw,64px)/1.1 'Old Standard TT',serif;letter-spacing:.3em;margin-right:-.3em}
.logo i{display:block;font-style:normal;font-size:11px;letter-spacing:.8em;margin-right:-.8em;color:var(--acc)}
.tabs{display:flex;justify-content:center;gap:12px;margin:28px 0 14px}
button{font:inherit;color:var(--ink);background:none;border:1px solid var(--rule);min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs button{padding:0 30px;font:500 15px 'Jost',sans-serif;letter-spacing:.25em;text-transform:uppercase}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#f0e7d4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.chips button{flex:none;padding:0 16px;border-radius:22px;font-size:14px}
h2{margin:22px 0 8px;padding-bottom:8px;border-bottom:2px solid var(--ink);font:700 24px/1.15 'Old Standard TT',serif;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid rgba(27,25,22,.16)}
.n{font-size:17px}
.d{grid-column:1;font-size:13.5px;color:var(--mut)}
.rt{grid-column:2;grid-row:1/3;text-align:right;white-space:nowrap}
.p{font-weight:500;font-size:17px}
.q{font-size:13px;color:var(--mut)}

/* кнопки добавления у позиции */
.add{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plus{padding:0 14px;font-size:14px;letter-spacing:.03em}
.plus:hover{background:rgba(140,28,43,.08)}
.st{display:inline-flex;align-items:center;border:1px solid var(--acc);background:var(--acc);color:#f0e7d4}
.st button{border:0;width:44px;font-size:20px;line-height:1;color:#f0e7d4}
.st button:hover{background:rgba(0,0,0,.15)}
.st span{min-width:2.2em;padding:0 4px;text-align:center;font-size:14px;font-weight:500;white-space:nowrap}

/* плавающая панель корзины */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#bar[hidden]{display:none}
#bar button{pointer-events:auto;width:100%;max-width:688px;min-height:54px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 20px;background:var(--acc);border-color:var(--acc);color:#f0e7d4;font-weight:500;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 6px 20px rgba(27,25,22,.3)}
#bar b{letter-spacing:.04em;font-size:18px}

/* окно корзины */
dialog{width:min(calc(100% - 24px),560px);max-height:calc(100dvh - 24px);padding:22px 20px 20px;border:3px double var(--rule);background:#f0e7d4;color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(27,25,22,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.dh h2{margin:0;padding:0;border:0}
.x{border:0;width:44px;font-size:28px;line-height:1}
.ci{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(27,25,22,.16)}
.ci .n{font-size:16px}
.ci .q{grid-column:1}
.ci .st{grid-column:1}
.ci .p{grid-column:2;grid-row:1/4;align-self:center}
.empty{padding:24px 0;text-align:center;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-size:18px}
.tot b{font:700 24px 'Old Standard TT',serif}
form{display:grid;gap:12px;margin-top:10px}
label{display:grid;gap:4px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
input{font:inherit;font-size:17px;width:100%;min-height:48px;padding:0 12px;border:1px solid var(--rule);background:var(--field);color:var(--ink);text-transform:none;letter-spacing:normal}
input[aria-invalid="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.err{margin:0;min-height:1.2em;font-size:14px;color:var(--acc)}
.go{min-height:54px;background:var(--acc);border-color:var(--acc);color:#f0e7d4;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.go:disabled{opacity:.6;cursor:wait}
.clr{width:100%;margin-top:10px;border:0;color:var(--mut);font-size:14px;text-decoration:underline}

/* экран подтверждения */
.ok{text-align:center}
.ok .big{margin:14px 0 4px;font:700 34px/1.15 'Old Standard TT',serif;color:var(--acc)}
.ok .hint{margin:0 0 12px;color:var(--mut)}
.ok .ci{text-align:left}
.ok .tm{font-size:13px;color:var(--mut);margin:6px 0 14px}
.ok .go{width:100%}
</style>
</head>
<body>
<div class="w">
<div class="logo"><b>ONYX</b><i>POKER CLUB</i></div>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>
<div id="sec"></div>
</div>

<div id="bar" hidden><button type="button" id="cartbtn"><span id="bcnt"></span><b id="bsum"></b></button></div>

<dialog id="dlg" aria-labelledby="dt">
  <div id="vCart">
    <div class="dh"><h2 id="dt">Ваш заказ</h2><button type="button" class="x" id="x1" aria-label="Закрыть">×</button></div>
    <div id="list"></div>
    <div id="checkout">
      <div class="tot"><span>Итого</span><b id="sum"></b></div>
      <form id="frm" novalidate>
        <label for="tbl">Номер стола<input id="tbl" name="table" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required></label>
        <label for="gid">Ваш ID в клубе<input id="gid" name="guest" maxlength="20" autocomplete="off" autocapitalize="characters" required></label>
        <p class="err" id="err" role="alert"></p>
        <button type="submit" class="go" id="send">Отправить заказ</button>
      </form>
      <button type="button" class="clr" id="clr">Очистить корзину</button>
    </div>
  </div>
  <div id="vOk" class="ok" hidden>
    <div class="dh"><h2 id="okt">Заказ принят</h2><button type="button" class="x" id="x2" aria-label="Закрыть">×</button></div>
    <p class="big" id="okWho"></p>
    <p class="hint" id="okHint"></p>
    <div id="okList"></div>
    <div class="tot"><span>Итого</span><b id="okSum"></b></div>
    <p class="tm" id="okTime"></p>
    <button type="button" class="go" id="done">Готово</button>
  </div>
</dialog>

<script>
/* ===== НАСТРОЙКА =====

   не отправляется, а гость видит экран с заказом, чтобы показать официанту. */
var ORDER_URL = "";

var D={food:[
["zak","Закуски",`Куриный попкорн|200 г|425 ₽

Сэндвич Мексиканский||590 ₽

["sn","Снеки",`Сыровяленая курица|70 г|270 ₽
Сыровяленая свинина|70 г|250 ₽
Гренки «Красная икра»|60 г|150 ₽
Гренки «Тайский перец»|60 г|150 ₽
Копчёный сыр со вкусом бекона|50 г|230 ₽
Кальмар вяленый|50 г|230 ₽
Фисташки Америка|50 г|250 ₽
Арахис крупный|50 г|110 ₽
Pringles в ассортименте|40 г|180 ₽`],
["tar","Пивные тарелки",`Тарелка «M»||750 ₽|наггетсы 6 шт, картофель фри 200 г, луковые кольца 6 шт, батат фри 200 г, вяленая свинина (порция), 2 соуса на выбор
Тарелка «L»||1200 ₽|куриный попкорн 300 г, картофель по-деревенски 400 г, куриные стрипсы 9 шт, драники 4 шт, вяленая курица (порция), 4 соуса на выбор`],
["des","Десерты",`Торт малина-фисташка||550 ₽
Чизкейк мраморный||400 ₽
Чизкейк фисташка||400 ₽
Мороженое||200 ₽|2 шарика на выбор: клубника / ваниль`],
["sou","Соусы",`Соус в ассортименте|30 г|55 ₽|Баффало (пикантный), сырный, кисло-сладкий, сырный чили (пикантный), барбекю, шрирача (острый), унаги`]
],bar:[
["lim","Лимонады",`Оникс - Onyx|450 / 900 мл|320 / 590 ₽|щавель-лайм
Руби Раш - Ruby Rash|450 / 900 мл|320 / 590 ₽|малина-алоэ
Гранд Цитрус - Grand Citrus|450 / 900 мл|320 / 590 ₽|грейпфрут-бузина

["chai","Чай",`Ассам|1000 мл|450 ₽

Фруктовый|1000 мл|450 ₽|яблоко, манго, ананас, лепестки сафлора и подсолнечника
Ягодный|1000 мл|450 ₽|чёрный чай, папайя, вишня, брусника, малина, тархун, мальва`],
["vod","Вода",`Легенды Байкала, негаз.|500 мл|200 ₽
Легенды Байкала, газ.|500 мл|200 ₽
Боржоми, ж/б|330 мл|300 ₽`],
["bez","Безалкогольное",`Адреналин Раш|330 мл|290 ₽
Ред Булл без сахара|250 мл|330 ₽
Ред Булл|250 мл|330 ₽
Кока-Кола слим|330 мл|290 ₽
Добрый Кола без сахара|330 мл|220 ₽
Rich Апельсин|200 мл|250 ₽
Rich Яблоко|200 мл|250 ₽
Rich Вишня|200 мл|250 ₽`],
["mil","Милкшейки",`Ваниль|350 мл|250 ₽
Клубника|350 мл|250 ₽`],
["kof","Кофе",`Эспрессо|50 мл|190 ₽
Американо|180 мл|190 ₽
Капучино|200 мл|250 ₽
Латте|200 мл|250 ₽`],
["pivo","Пиво и сидр",`Миллер Дженьюин, США, лагер 4,7%|330 мл|400 ₽
Корона Экстра, Мексика, лагер 4,5%|330 мл|430 ₽
Циндао Лагер, Китай, 4,7%|330 мл|390 ₽
Франц Лагер, Чехия, 4,5%|500 мл|650 ₽
Майзелс Вайс Оридж, Германия, 5,1%|500 мл|690 ₽
Якобинус Хевевайцен, Германия, 5,6%|500 мл|590 ₽
Магнум Хеллес, Ярославль, 4,5%|450 мл|450 ₽
Магнум Вайсбир, Ярославль, 5,2%|450 мл|450 ₽
Магнум Американ ИПА, Ярославль, 6,5%|450 мл|450 ₽
Магнум Милк Стаут, Ярославль, 6,3%|450 мл|450 ₽
Бродилка Сидр Сухой, Россия, 6%|450 мл|590 ₽
Бродилка Полусладкий, Россия, 5,5%|450 мл|590 ₽
Медовуха Степь Смородина, Россия, 6%|450 мл|650 ₽
Медовуха Степь Черника, Россия, 6%|450 мл|650 ₽
Биг Пот Ред Аер Хорс|450 мл|620 ₽|Россия, смузи-эль 6,5%
Биг Пот Изи Сквизин|450 мл|620 ₽|Россия, смузи-эль 6,5%
Линденманс Вишня, Бельгия, 3,5%|250 мл|850 ₽
Петрюс Ред, Бельгия, 8,5%|330 мл|870 ₽
Бэрримор Овсяный Стаут, Ярославль, 6%|450 мл|450 ₽
Джавс Нитро Стаут, Россия, 6%|450 мл|570 ₽`],
["ba","Безалкогольное пиво",`Клаусталер Ориджинал, б/а, 0,49%|330 мл|390 ₽`]
]};
var T=[["food","Еда"],["bar","Бар"]],tab="food",cur=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function $(id){return document.getElementById(id)}
function money(n){return n.toLocaleString("ru-RU")+" ₽"}

/* ===== Разбор позиций и варианты (например 450 / 900 мл) ===== */
var IDX={}; // ключ позиции -> {n:название, s:объём, p:цена}
function splitSizes(q,n){
  var a=q.split("/").map(function(x){return x.trim()});
  if(a.length!==n){var r=[];for(var i=0;i<n;i++)r.push("Вариант "+(i+1));return r}
  var u=(a[a.length-1].match(/[^\d\s,.].*$/)||[""])[0];
  return a.map(function(x){return /[^\d\s,.]/.test(x)?x:x+" "+u});
}
function parseLine(sid,line,li){
  var f=line.split("|"),q=f[1]||"";
  var pr=(f[2]||"").replace(/₽/g,"").split("/").map(function(x){return parseInt(x.replace(/\s/g,""),10)||0});
  var sz=pr.length>1?splitSizes(q,pr.length):[q];
  var keys=pr.map(function(p,i){var k=sid+"-"+li+"-"+i;IDX[k]={n:f[0],s:sz[i],p:p};return k});
  return {f:f,keys:keys,multi:pr.length>1};
}
var P={};
T.forEach(function(t){P[t[0]]=D[t[0]].map(function(s){
  return s[2].split("\n").map(function(l,li){return parseLine(s[0],l,li)});
})});

/* ===== Корзина ===== */
var C={};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
(function(){try{var c=JSON.parse(store("onyx_cart")||"{}");for(var k in c)if(IDX[k]&&c[k]>0)C[k]=Math.min(99,c[k]|0)}catch(e){}})();
function save(){store("onyx_cart",JSON.stringify(C))}
function count(){var n=0;for(var k in C)n+=C[k];return n}
function total(){var s=0;for(var k in C)s+=C[k]*IDX[k].p;return s}
function items(){var r=[];for(var k in C){var it=IDX[k];r.push({key:k,name:it.n,size:it.s,price:it.p,qty:C[k],sum:it.p*C[k]})}return r}
function plural(n){var a=n%10,b=n%100;return a===1&&b!==11?"позиция":a>=2&&a<=4&&(b<12||b>14)?"позиции":"позиций"}

var CT={}; // ключ -> контейнер кнопок в меню
function setQ(k,q,from){
  if(q>0)C[k]=Math.min(99,q);else delete C[k];
  save();
  if(CT[k])fill(CT[k].w,k,CT[k].l);
  updBar();
  if(dlg.open)renderCart();
  var root=from==="cart"?$("list"):CT[k]&&CT[k].w;
  var t=root&&(root.querySelector('.inc[data-k="'+k+'"]')||root.querySelector('.plus[data-k="'+k+'"]'));
  if(t)t.focus();else if(from==="cart")$("x1").focus();
}
function stepper(k,lbl,from){
  var it=IDX[k],q=C[k]||0,w=el("span","st");
  var dec=el("button","dec","−");dec.type="button";dec.dataset.k=k;
  dec.setAttribute("aria-label","Убрать одну: "+it.n+(lbl?", "+lbl:""));
  dec.onclick=function(){setQ(k,(C[k]||0)-1,from)};
  var inc=el("button","inc","+");inc.type="button";inc.dataset.k=k;
  inc.setAttribute("aria-label","Добавить ещё: "+it.n+(lbl?", "+lbl:""));
  inc.onclick=function(){setQ(k,(C[k]||0)+1,from)};
  w.appendChild(dec);w.appendChild(el("span","",(lbl?lbl+" · ":"")+q+" шт"));w.appendChild(inc);
  return w;
}
function fill(w,k,lbl){
  w.textContent="";
  if(C[k]){w.appendChild(stepper(k,lbl,"menu"));return}
  var it=IDX[k],b=el("button","plus","+ "+(lbl?lbl+" · "+money(it.p):"В корзину"));
  b.type="button";b.dataset.k=k;
  b.setAttribute("aria-label","Добавить в корзину: "+it.n+(lbl?", "+lbl:""));
  b.onclick=function(){setQ(k,1,"menu")};
  w.appendChild(b);
}

/* ===== Меню ===== */
function renderNav(){
  var tb=$("tabs"),ch=$("chips");tb.textContent="";ch.textContent="";
  T.forEach(function(t){var b=el("button","",t[1]);b.type="button";b.setAttribute("aria-pressed",String(t[0]===tab));b.onclick=function(){tab=t[0];cur=0;render()};tb.appendChild(b)});
  D[tab].forEach(function(s,i){var b=el("button","",s[1]);b.type="button";b.setAttribute("aria-pressed",String(i===cur));b.onclick=function(){cur=i;render()};ch.appendChild(b)});
}
function renderSec(){
  var sc=$("sec"),s=D[tab][cur];sc.textContent="";CT={};
  try{history.replaceState(null,"","#"+s[0])}catch(e){}
  sc.appendChild(el("h2","",s[1]));
  P[tab][cur].forEach(function(r){
    var f=r.f,row=el("div","row"),rt=el("div","rt"),add=el("div","add");
    row.appendChild(el("div","n",f[0]));
    if(f[3])row.appendChild(el("div","d",f[3]));
    rt.appendChild(el("div","p",f[2]));
    if(f[1])rt.appendChild(el("div","q",f[1]));
    row.appendChild(rt);
    r.keys.forEach(function(k){
      var lbl=r.multi?IDX[k].s:"",w=el("span");
      CT[k]={w:w,l:lbl};fill(w,k,lbl);add.appendChild(w);
    });
    row.appendChild(add);sc.appendChild(row);
  });
}
function render(){renderNav();renderSec()}

/* ===== Панель и окно корзины ===== */
var dlg=$("dlg");
function updBar(){
  var n=count();$("bar").hidden=!n;
  $("bcnt").textContent="Корзина · "+n;$("bsum").textContent=money(total());
  $("cartbtn").setAttribute("aria-label","Открыть корзину: "+n+" "+plural(n)+", "+money(total()));
}
function itemRow(it,withStepper){
  var r=el("div","ci");
  r.appendChild(el("div","n",it.name));
  var meta=[it.size,money(it.price)+(withStepper?"":" × "+it.qty)].filter(Boolean).join(" · ");
  r.appendChild(el("div","q",meta));
  if(withStepper)r.appendChild(stepper(it.key,"","cart"));
  r.appendChild(el("div","p",money(it.sum)));
  return r;
}
function renderCart(){
  var l=$("list"),its=items();l.textContent="";
  $("checkout").hidden=!its.length;
  if(!its.length){l.appendChild(el("p","empty","Корзина пуста. Добавьте позиции из меню."));return}
  its.forEach(function(it){l.appendChild(itemRow(it,true))});
  $("sum").textContent=money(total());
}
function openCart(){
  $("vCart").hidden=false;$("vOk").hidden=true;$("err").textContent="";
  if(!$("tbl").value)$("tbl").value=store("onyx_table")||"";
  if(!$("gid").value)$("gid").value=store("onyx_guest")||"";
  renderCart();dlg.showModal();document.body.classList.add("lock");
}
$("cartbtn").onclick=openCart;
$("x1").onclick=$("x2").onclick=function(){dlg.close()};
dlg.addEventListener("close",function(){document.body.classList.remove("lock");$("cartbtn").focus&&!$("bar").hidden&&$("cartbtn").focus()});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
$("clr").onclick=function(){if(confirm("Очистить корзину?")){C={};save();updBar();renderSec();renderCart()}};
$("done").onclick=function(){dlg.close()};
$("tbl").addEventListener("input",function(){this.value=this.value.replace(/\D/g,"");this.removeAttribute("aria-invalid")});
$("gid").addEventListener("input",function(){this.removeAttribute("aria-invalid")});

/* ===== Оформление заказа ===== */
$("frm").addEventListener("submit",function(e){
  e.preventDefault();
  var tb=$("tbl"),gd=$("gid"),er=$("err"),table=tb.value.trim(),guest=gd.value.trim(),bad=null;
  tb.removeAttribute("aria-invalid");gd.removeAttribute("aria-invalid");
  if(!guest){gd.setAttribute("aria-invalid","true");bad=gd;er.textContent="Укажите ваш ID в клубе"}
  if(!/^\d{1,4}$/.test(table)){tb.setAttribute("aria-invalid","true");bad=tb;er.textContent=guest?"Укажите номер стола":"Укажите номер стола и ваш ID"}
  if(bad){bad.focus();return}
  if(!count()){er.textContent="Корзина пуста";return}
  er.textContent="";
  store("onyx_table",table);store("onyx_guest",guest);
  var order={table:table,guestId:guest,items:items().map(function(i){return{name:i.name,size:i.size,price:i.price,qty:i.qty,sum:i.sum}}),total:total(),createdAt:new Date().toISOString()};
  if(!ORDER_URL){done(order,false);return}
  var btn=$("send");btn.disabled=true;btn.textContent="Отправляем…";
  fetch(ORDER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)})
    .then(function(r){if(!r.ok)throw 0;done(order,true)})
    .catch(function(){er.textContent="Не удалось отправить заказ. Попробуйте ещё раз или позовите официанта."})
    .then(function(){btn.disabled=false;btn.textContent="Отправить заказ"});
});
function done(order,sent){
  $("okt").textContent=sent?"Заказ отправлен":"Ваш заказ";
  $("okWho").textContent="Стол "+order.table+" · ID "+order.guestId;
  $("okHint").textContent=sent?"Официант скоро подойдёт.":"Покажите этот экран официанту.";
  var l=$("okList");l.textContent="";
  order.items.forEach(function(i){l.appendChild(itemRow(i,false))});
  $("okSum").textContent=money(order.total);
  $("okTime").textContent=new Date(order.createdAt).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  C={};save();updBar();renderSec();
  $("vCart").hidden=true;$("vOk").hidden=false;$("done").focus();
}

(function(){var h=(location.hash||"").slice(1);
["food","bar"].forEach(function(k){D[k].forEach(function(s,i){if(s[0]===h){tab=k;cur=i}})});
render();updBar()})();
</script>
</body>
</html>
